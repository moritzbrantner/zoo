name: Materialize zoo gameplay feature

on:
  push:
    branches: [feature/drawn-habitats-entrance-animals]
    paths:
      - scripts/materialize-zoo-feature.py
      - .github/workflows/materialize-zoo-feature.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/drawn-habitats-entrance-animals
      - name: Materialize prepared sources
        run: python3 scripts/materialize-zoo-feature.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust
        run: cargo fmt --all
      - name: Remove temporary materializer
        run: rm scripts/materialize-zoo-feature.py .github/workflows/materialize-zoo-feature.yml
      - name: Commit prepared gameplay slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add drawn habitats entrance and animated animals"
          git push origin HEAD:feature/drawn-habitats-entrance-animals

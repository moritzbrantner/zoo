name: Apply guest needs slice

on:
  push:
    branches:
      - feature/guest-needs-thoughts

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/guest-needs-thoughts
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply deterministic guest needs
        run: python3 tools/apply_guest_needs.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit slice
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/zoo-core/src/lib.rs apps/web/src/App.tsx apps/web/src/styles.css
          git diff --cached --quiet && exit 0
          git commit -m "Implement deterministic guest needs and thoughts"
          git push origin HEAD:feature/guest-needs-thoughts

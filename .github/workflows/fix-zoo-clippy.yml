name: Fix zoo Clippy modernization

on:
  push:
    branches: [feature/drawn-habitats-entrance-animals]
    paths:
      - .github/workflows/fix-zoo-clippy.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/drawn-habitats-entrance-animals
      - name: Apply narrow Clippy fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/zoo-core/src/lib.rs")
          text = path.read_text()
          old = "self.minute_of_day % CARE_DECAY_INTERVAL_MINUTES == 0"
          new = "self.minute_of_day.is_multiple_of(CARE_DECAY_INTERVAL_MINUTES)"
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one match, got {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust
        run: cargo fmt --all
      - name: Remove temporary workflow
        run: rm .github/workflows/fix-zoo-clippy.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Rust 1.98 Clippy warning"
          git push origin HEAD:feature/drawn-habitats-entrance-animals

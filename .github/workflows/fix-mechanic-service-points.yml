name: Repair mechanic service points

on:
  push:
    branches: [operations/mechanic-maintenance-backlog]
    paths:
      - .github/mechanic-service-point-trigger.txt

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: operations/mechanic-maintenance-backlog
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply service-point repair
        run: python .github/scripts/fix_mechanic_service_points.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Lint Rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test Rust
        run: cargo test --workspace
      - name: Persist product repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/zoo-core/src/lib.rs
          git diff --cached --check
          git commit -m 'fix: choose reachable mechanic service points'
          git push origin HEAD:operations/mechanic-maintenance-backlog

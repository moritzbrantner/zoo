name: Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Checkout pinned asset-tooling
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: moritzbrantner/asset-tooling
          ref: a9184128839b9c411103e958703c2d1c03dfc9a8
          path: .consumer-tools/asset-tooling
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Generate and replay-verify Zoo asset
        run: |
          spec="apps/web/public/generated-assets/zoo-park-texture.asset.json"
          tool=".consumer-tools/asset-tooling/src/entry.js"
          bun "$tool" validate "$spec"
          bun "$tool" generate "$spec" --receipt .asset-tooling/zoo-park-texture.receipt.json
          bun "$tool" verify "$spec" --receipt .asset-tooling/zoo-park-texture.receipt.json
      - name: Rust format
        run: cargo fmt --all --check
      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Install web dependencies
        working-directory: apps/web
        run: bun install
      - name: Build web
        working-directory: apps/web
        run: bun run build
      - name: Browser visual dogfood
        if: github.event_name == 'pull_request'
        working-directory: apps/web
        run: |
          bun run preview -- --host 127.0.0.1 --port 4173 > /tmp/zoo-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              cat /tmp/zoo-preview.log
              exit 1
            fi
            sleep 1
          done
          bun scripts/capture-park-view-proof.mjs
      - name: Upload park view visual proof
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zoo-park-view-visual-proof
          path: |
            apps/web/test-results/park-view-desktop.png
            apps/web/test-results/park-view-phone.png
          if-no-files-found: error
          retention-days: 7
      - name: Upload playable web preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zoo-playable-preview
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

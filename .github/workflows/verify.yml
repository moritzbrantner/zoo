name: Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Rust format
        run: cargo fmt --all --check
      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Install web dependencies
        working-directory: apps/web
        run: bun install
      - name: Build web
        working-directory: apps/web
        run: bun run build
      - name: Browser fence dogfood
        if: github.event_name == 'pull_request'
        working-directory: apps/web
        run: |
          bun run preview -- --host 127.0.0.1 --port 4173 > /tmp/zoo-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              cat /tmp/zoo-preview.log
              exit 1
            fi
            sleep 1
          done
          bun scripts/capture-fence-proof.mjs
      - name: Upload fence visual proof
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: zoo-fence-visual-proof
          path: apps/web/test-results/fence-rendering.png
          if-no-files-found: error
          retention-days: 7
      - name: Upload playable web preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: zoo-playable-preview
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

name: Materialize Environment v1

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out zoo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Check out platform-upgrader
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: moritzbrantner/platform-upgrader
          ref: 57560fc7022f3c80b4fced59c95841423db6f1dc
          path: .tooling/platform-upgrader

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0

      - name: Materialize web lockfile
        working-directory: apps/web
        run: bun install --lockfile-only

      - name: Apply Environment v1
        run: bun .tooling/platform-upgrader/src/cli.js apply environment-v1 .

      - name: Add repository-specific nested Bun setup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.repository-environment.toml')
          source = path.read_text()
          source = source.replace(
              'commands = ["cargo fetch --locked"]',
              'commands = ["cargo fetch --locked", "cd apps/web && bun install --frozen-lockfile"]',
          )
          path.write_text(source)
          PY

      - name: Verify generated environment
        run: bun .tooling/platform-upgrader/src/cli.js audit .

      - name: Package generated state
        run: |
          set -euo pipefail
          mkdir -p .artifacts/environment-v1
          tar -czf .artifacts/environment-v1/state.tar.gz \
            .repository-environment.toml \
            scripts/codex-environment.sh \
            apps/web/bun.lock

      - name: Upload generated state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: environment-v1-state
          path: .artifacts/environment-v1/state.tar.gz
          if-no-files-found: error
          retention-days: 1

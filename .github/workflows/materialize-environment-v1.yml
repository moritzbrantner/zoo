name: Materialize Environment v1

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out zoo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0

      - name: Materialize web lockfile
        working-directory: apps/web
        run: |
          set -euo pipefail
          bun install --lockfile-only
          test -f bun.lock

      - name: Upload generated web lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zoo-web-bun-lock
          path: apps/web/bun.lock
          if-no-files-found: error
          retention-days: 1

name: Format authoritative preview branch

on:
  push:
    branches:
      - feature/authoritative-habitat-preview

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/authoritative-habitat-preview
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/zoo-core/src/lib.rs
          git commit -m "Apply rustfmt to habitat preview"
          git push origin HEAD:feature/authoritative-habitat-preview

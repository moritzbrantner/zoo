name: Apply concession slice

on:
  push:
    branches: [feature/guest-concessions]

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/guest-concessions
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply source patch
        run: python scripts/apply-concession-slice.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Export generated source
        run: |
          mkdir -p generated/crates/zoo-core/src generated/apps/web/src generated/apps/web/scripts generated/.github/workflows
          cp crates/zoo-core/src/lib.rs generated/crates/zoo-core/src/lib.rs
          cp apps/web/src/App.tsx generated/apps/web/src/App.tsx
          cp apps/web/src/main.tsx generated/apps/web/src/main.tsx
          cp apps/web/src/concessions.css generated/apps/web/src/concessions.css
          cp apps/web/scripts/capture-concessions-proof.mjs generated/apps/web/scripts/capture-concessions-proof.mjs
          cp .github/workflows/verify.yml generated/.github/workflows/verify.yml
      - uses: actions/upload-artifact@v4
        with:
          name: generated-concession-slice
          path: generated
          if-no-files-found: error
          retention-days: 1

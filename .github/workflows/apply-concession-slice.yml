name: Apply concession slice

on:
  push:
    branches: [feature/guest-concessions]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/guest-concessions
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply source patch
        run: python scripts/apply-concession-slice.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Remove temporary patch machinery
        run: |
          rm scripts/apply-concession-slice.py
          rm .github/workflows/apply-concession-slice.yml
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'gameplay: add guest food and drink stands'
          git push origin HEAD:feature/guest-concessions

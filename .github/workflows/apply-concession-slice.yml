name: Apply concession slice

on:
  push:
    branches: [feature/guest-concessions]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/guest-concessions
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply and format source
        run: |
          python scripts/apply-concession-slice.py
          cargo fmt --all
      - name: Commit generated implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/zoo-core/src/lib.rs apps/web/src/App.tsx apps/web/src/main.tsx apps/web/src/concessions.css apps/web/scripts/capture-concessions-proof.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'gameplay: add guest food and drink stands'
          git push origin HEAD:feature/guest-concessions

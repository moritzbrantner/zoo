name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned asset-tooling
        uses: actions/checkout@v4
        with:
          repository: moritzbrantner/asset-tooling
          ref: a9184128839b9c411103e958703c2d1c03dfc9a8
          path: .consumer-tools/asset-tooling
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Generate and replay-verify Zoo asset
        run: |
          spec="apps/web/public/generated-assets/zoo-park-texture.asset.json"
          tool=".consumer-tools/asset-tooling/src/entry.js"
          bun "$tool" validate "$spec"
          bun "$tool" generate "$spec" --receipt .asset-tooling/zoo-park-texture.receipt.json
          bun "$tool" verify "$spec" --receipt .asset-tooling/zoo-park-texture.receipt.json
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Install web dependencies
        working-directory: apps/web
        run: bun install
      - name: Build
        working-directory: apps/web
        run: bun run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

name: Materialize animal-care slice v2

on:
  push:
    branches: [gameplay/animal-care-depot]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gameplay/animal-care-depot
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Correct materializer test anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/materialize_animal_care.py')
          text = path.read_text()
          old = '        staff_habitat(state, habitat_id);'
          if text.count(old) != 1:
              raise SystemExit(f'expected one generic staffing insertion, found {text.count(old)}')
          text = text.replace(old, '        staff_habitat(&mut state, habitat_id);', 1)
          marker = '    4,\n)\n\nreplace_once(\n    rust,\n    """        let habitat_id = state.habitats[0].id;\\n        assert_eq!(state.habitats[0].capacity(), 8);'
          if marker not in text:
              raise SystemExit('generic staffing count marker not found')
          text = text.replace(marker, marker.replace('    4,', '    3,'), 1)
          path.write_text(text)
          PY
      - name: Apply animal-care slice
        run: python .github/scripts/materialize_animal_care.py
      - name: Staff deterministic fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/zoo-core/src/lib.rs')
          text = path.read_text()
          old = '''            let habitat_id = state.habitats[0].id;
            assert!(state.adopt(habitat_id, "penguin").ok);'''
          new = '''            let habitat_id = state.habitats[0].id;
            staff_habitat(state, habitat_id);
            assert!(state.adopt(habitat_id, "penguin").ok);'''
          if text.count(old) != 1:
              raise SystemExit(f'expected deterministic fixture once, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format Rust
        run: cargo fmt --all
      - name: Lint Rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test Rust
        run: cargo test --workspace
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Install web dependencies
        working-directory: apps/web
        run: bun install
      - name: Build web
        working-directory: apps/web
        run: bun run build
      - name: Commit materialized implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/materialize_animal_care.py .github/workflows/materialize-animal-care.yml .github/workflows/materialize-animal-care-v2.yml
          git add crates/zoo-core/src/lib.rs apps/web/src/App.tsx apps/web/src/concessions.css apps/web/scripts/capture-concessions-proof.mjs apps/web/scripts/capture-animal-care-proof.mjs .github/workflows/verify.yml
          git commit -m "gameplay: add animal-care depot and scheduled feeding"
          git push origin HEAD:gameplay/animal-care-depot

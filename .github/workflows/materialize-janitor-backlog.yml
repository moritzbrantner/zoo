name: Materialize janitor backlog slice

on:
  push:
    branches: [operations/janitor-litter-backlog]
    paths:
      - .github/janitor-backlog-trigger.txt

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: operations/janitor-litter-backlog
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Apply janitor backlog slice
        run: python .github/scripts/materialize_janitor_backlog.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Lint Rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test Rust
        run: cargo test --workspace
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Install web dependencies
        working-directory: apps/web
        run: bun install
      - name: Build web
        working-directory: apps/web
        run: bun run build
      - name: Persist product implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            crates/zoo-core/src/lib.rs \
            apps/web/src/App.tsx \
            apps/web/src/concessions.css \
            apps/web/src/three-d.css \
            apps/web/scripts/capture-animal-care-proof.mjs
          git diff --cached --check
          git commit -m 'gameplay: add janitor cleanup backlog'
          git push origin HEAD:operations/janitor-litter-backlog

[package]
name = "zoo_game"
version = "0.1.0"
description = "Zoo management slice built on the shared farm game engine."
edition = "2024"
rust-version = "1.85"
publish = false

[workspace]
members = [".", "server", "tools/contract_codegen"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
axum = "0.8"
bevy_app = "0.18.1"
bevy_ecs = "0.18.1"
schemars = "0.8"
serde = "1"
serde_json = "1"
tokio = "1"
tower = "0.5"
tower-http = "0.6"
ts-rs = "10"
wasm-bindgen = "0.2"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
farm_engine = { git = "https://github.com/moritzbrantner/farm-game-engine", rev = "99922eeae3abdb77b5dbdcfb2c460ab71f3b68e5", features = ["serde"] }
farm_scenario = { git = "https://github.com/moritzbrantner/farm-game-engine", rev = "99922eeae3abdb77b5dbdcfb2c460ab71f3b68e5", features = ["serde"] }
bevy_app.workspace = true
bevy_ecs.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
schemars = { workspace = true, optional = true }
ts-rs = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[features]
default = []
contracts = ["farm_engine/contracts", "farm_scenario/contracts", "dep:schemars", "dep:ts-rs"]
wasm = ["dep:wasm-bindgen"]

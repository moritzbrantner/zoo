[package]
name = "zoo_server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Authoritative HTTP server for the zoo game slice."
publish = false

[dependencies]
axum.workspace = true
farm_engine = { git = "https://github.com/moritzbrantner/farm-game-engine", rev = "956681e079ef0ffbc6d5393ddd01b65264e3a387", features = ["serde"] }
farm_persistence = { git = "https://github.com/moritzbrantner/farm-game-engine", rev = "956681e079ef0ffbc6d5393ddd01b65264e3a387", features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
tower-http = { workspace = true, features = ["cors"] }
zoo_game = { path = ".." }

[dev-dependencies]
tower.workspace = true

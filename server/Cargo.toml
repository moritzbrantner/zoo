[package]
name = "zoo_server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Authoritative HTTP server for the zoo game slice."
publish = false

[dependencies]
axum.workspace = true
farm_engine = { path = "../../farm-game-engine/crates/farm_engine", features = ["serde"] }
farm_persistence = { path = "../../farm-game-engine/crates/farm_persistence", features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
tower-http = { workspace = true, features = ["cors"] }
zoo_game = { path = ".." }

[dev-dependencies]
tower.workspace = true

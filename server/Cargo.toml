[package]
name = "zoo_server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Authoritative HTTP server for the zoo game slice."
publish = false

[dependencies]
axum.workspace = true
farm_engine = { git = "https://github.com/moritzbrantner/farm-game-engine", rev = "99922eeae3abdb77b5dbdcfb2c460ab71f3b68e5", features = ["serde"] }
farm_persistence = { git = "https://github.com/moritzbrantner/farm-game-engine", rev = "99922eeae3abdb77b5dbdcfb2c460ab71f3b68e5", features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
tower-http = { workspace = true, features = ["cors"] }
zoo_game = { path = ".." }

[dev-dependencies]
tower.workspace = true
